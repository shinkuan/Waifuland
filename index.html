<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Waifuland</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="live2d-canvas"></canvas>

  <!-- Model selector (right-click menu) -->
  <div id="context-menu" class="hidden">
    <div id="model-list"></div>
    <div class="menu-separator"></div>
    <div class="menu-header">Background Color</div>
    <div class="menu-item chroma-btn" data-color="transparent">Transparent (True Alpha)</div>
    <div class="menu-item chroma-btn" data-color="0x00FF00">Green Screen</div>
    <div class="menu-item chroma-btn" data-color="0xFF0000">Red Screen</div>
    <div class="menu-item chroma-btn" data-color="0x0000FF">Blue Screen</div>
    <div class="menu-separator"></div>
    <div class="menu-item" id="btn-toggle-topmost">Always on Top: ON</div>
    <div class="menu-item" id="btn-quit">Quit</div>
  </div>

  <!-- Bundled libraries (loaded before main module) -->
  <script src="/lib/pixi.min.js"></script>
  <script src="/lib/live2dcubismcore.min.js"></script>
  <script src="/lib/cubism4.min.js"></script>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
